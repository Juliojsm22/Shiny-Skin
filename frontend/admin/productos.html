<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos – SISCO Admin</title>
  <link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
</head>
<body class="admin-body">
<aside class="admin-sidebar">
  <div class="sidebar-logo"><div class="logo-text">✨ SISCO</div><div class="logo-sub">Shiny Skin · Panel Admin</div></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section">Principal</div>
    <a href="dashboard.html" class="sidebar-item"><span class="sidebar-icon">📊</span>Dashboard</a>
    <div class="sidebar-section">Gestión</div>
    <a href="productos.html" class="sidebar-item active"><span class="sidebar-icon">📦</span>Productos</a>
    <a href="inventario.html" class="sidebar-item"><span class="sidebar-icon">🗃️</span>Inventario</a>
    <a href="pedidos.html" class="sidebar-item"><span class="sidebar-icon">🛒</span>Pedidos</a>
    <a href="facturacion.html" class="sidebar-item"><span class="sidebar-icon">💳</span>Facturación</a>
    <a href="../index.html" class="sidebar-item" target="_blank"><span class="sidebar-icon">🌐</span>Ver Tienda</a>
    <a href="../login.html" class="sidebar-item"><span class="sidebar-icon">🚪</span>Cerrar sesión</a>
  </nav>
  <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar">A</div><div><div class="sidebar-user-name">Administrador</div><div class="sidebar-user-role">Admin</div></div></div></div>
</aside>

<div class="admin-main">
  <header class="admin-topbar">
    <div class="topbar-title">📦 Gestión de Productos</div>
    <div class="topbar-actions">
      <button class="btn-admin-primary" onclick="openProductModal()">➕ Nuevo producto</button>
    </div>
  </header>

  <div class="admin-content">
    <div class="actions-bar">
      <div class="actions-bar-left">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input class="search-input-admin" type="text" id="prodSearch" placeholder="Buscar producto o SKU..." oninput="filterProds()" />
        </div>
        <select class="admin-form-control" style="width:160px;padding:10px 14px;" id="catFilter" onchange="filterProds()">
          <option value="">Todas las categorías</option>
          <option value="Skincare">Skincare</option>
          <option value="Makeup">Makeup</option>
        </select>
      </div>
      <div class="actions-bar-right">
        <span id="prodCount" style="font-size:0.85rem;color:rgba(255,255,255,0.35);">0 productos</span>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr><th>Imagen</th><th>Producto</th><th>Marca</th><th>Categoría</th><th>Costo</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="prodTableBody">
            <tr><td colspan="9" style="text-align:center;padding:32px;color:rgba(255,255,255,0.3);">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Producto -->
<div class="modal-overlay" id="productModal">
  <div class="admin-modal" style="max-width:640px;">
    <div class="modal-header">
      <div class="modal-title" id="modalProdTitle">Nuevo Producto</div>
      <button class="modal-close" onclick="closeModal('productModal')">✕</button>
    </div>
    <div class="admin-form-grid">
      <div class="admin-form-group admin-form-full"><label class="admin-form-label">Nombre del producto *</label><input class="admin-form-control" id="pNombre" placeholder="Ej: ANUA Heartleaf 77% Soothing Serum" required/></div>
      <div class="admin-form-group"><label class="admin-form-label">SKU</label><input class="admin-form-control" id="pSku" placeholder="SKN-SER-001"/></div>
      <div class="admin-form-group"><label class="admin-form-label">Marca</label><input class="admin-form-control" id="pMarca" placeholder="ANUA, COSRX, rom&nd..."/></div>
      <div class="admin-form-group"><label class="admin-form-label">Categoría</label>
        <select class="admin-form-control" id="pCategoria">
          <option>Skincare</option><option>Sueros & Esencias</option><option>Limpiadores</option>
          <option>Hidratantes & Cremas</option><option>Protectores Solares</option>
          <option>Mascarillas</option><option>Tónicos</option>
          <option>Makeup</option><option>Labios</option><option>Rostro</option>
        </select>
      </div>
      <div class="admin-form-group"><label class="admin-form-label">Precio costo (C$) *</label><input class="admin-form-control" id="pCosto" type="number" min="0" step="0.01" placeholder="0.00" oninput="calcMargen()"/></div>
      <div class="admin-form-group"><label class="admin-form-label">Precio venta (C$) *</label><input class="admin-form-control" id="pVenta" type="number" min="0" step="0.01" placeholder="0.00" oninput="calcMargen()"/></div>
      <div class="admin-form-group"><label class="admin-form-label">Stock inicial</label><input class="admin-form-control" id="pStock" type="number" min="0" value="0"/></div>
      <div class="admin-form-group"><label class="admin-form-label">Stock mínimo</label><input class="admin-form-control" id="pStockMin" type="number" min="0" value="5"/></div>
      <div class="admin-form-group"><label class="admin-form-label">Descuento (%)</label><input class="admin-form-control" id="pDescuento" type="number" min="0" max="100" value="0"/></div>
      <div class="admin-form-group" style="align-self:end;">
        <div id="margenInfo" style="padding:10px 12px;background:rgba(76,175,125,0.1);border-radius:8px;font-size:0.82rem;color:var(--color-success);">Margen: –</div>
      </div>
      <div class="admin-form-group admin-form-full">
        <label class="admin-form-label">Imagen</label>
        <div style="display:flex;gap:12px;align-items:center;">
          <img id="pImagenPreview" src="" alt="Preview" style="display:none;width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--color-surface-3);"/>
          <input class="admin-form-control" type="file" id="pImagenFile" accept="image/*" style="padding:8px;flex:1;"/>
        </div>
      </div>
      <div class="admin-form-group admin-form-full"><label class="admin-form-label">Descripción</label><textarea class="admin-form-control" id="pDesc" rows="3" placeholder="Descripción del producto..."></textarea></div>
      <div class="admin-form-group admin-form-full"><label class="admin-form-label">Beneficios</label><input class="admin-form-control" id="pBeneficios" placeholder="Calma · Hidrata · Ilumina (separar con ·)"/></div>
      <div class="admin-form-group" style="flex-direction:row;align-items:center;gap:10px;">
        <input type="checkbox" id="pNuevo" style="accent-color:var(--color-primary);width:18px;height:18px;"/>
        <label for="pNuevo" class="admin-form-label" style="margin:0;cursor:pointer;">🆕 Producto nuevo</label>
      </div>
      <div class="admin-form-group" style="flex-direction:row;align-items:center;gap:10px;">
        <input type="checkbox" id="pDestacado" style="accent-color:var(--color-primary);width:18px;height:18px;"/>
        <label for="pDestacado" class="admin-form-label" style="margin:0;cursor:pointer;">⭐ Producto destacado</label>
      </div>
    </div>
    <input type="hidden" id="pEditId"/>
    <div style="display:flex;gap:12px;margin-top:24px;">
      <button class="btn-admin-primary" style="flex:1;" onclick="saveProduct()">✅ Guardar producto</button>
      <button class="btn-admin-secondary" onclick="closeModal('productModal')">Cancelar</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
let allProducts = [];

async function init() {
  allProducts = await fetchProductos();
  filterProds();
}

async function fetchProductos() {
  try {
    return await api.productos.list();
  } catch (err) {
    return [];
  }
}

function filterProds() {
  const q = document.getElementById('prodSearch').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  let filtered = allProducts.filter(p => {
    if (q && !p.nombre.toLowerCase().includes(q) && !(p.sku||'').toLowerCase().includes(q) && !(p.marca||'').toLowerCase().includes(q)) return false;
    if (cat && !(p.categoria||'').includes(cat)) return false;
    return true;
  });
  document.getElementById('prodCount').textContent = filtered.length + ' productos';
  renderTable(filtered);
}

function renderTable(products) {
  const body = document.getElementById('prodTableBody');
  if (!products.length) { body.innerHTML='<tr><td colspan="9" style="text-align:center;padding:32px;color:rgba(255,255,255,0.3);">Sin resultados</td></tr>'; return; }
  body.innerHTML = products.map(p=>`
    <tr>
      <td><img src="${p.imagen_url||''}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;background:rgba(255,255,255,0.05);" alt="${p.nombre}" onerror="this.style.display='none'"/></td>
      <td>
        <div class="table-product-name">${p.nombre.split(' ').slice(0,5).join(' ')}</div>
        <div class="table-product-sku">${p.sku||'–'}</div>
        <div style="display:flex;gap:4px;margin-top:4px;">
          ${p.es_nuevo?'<span class="badge tag-new" style="font-size:0.6rem;">New</span>':''}
          ${p.es_destacado?'<span class="badge badge-gold" style="font-size:0.6rem;">⭐</span>':''}
          ${p.descuento > 0 ? `<span class="badge" style="font-size:0.6rem;background:var(--color-danger);color:white;">-${p.descuento}%</span>` : ''}
        </div>
      </td>
      <td style="font-size:0.82rem;">${p.marca||'–'}</td>
      <td style="font-size:0.82rem;">${p.categoria||'–'}</td>
      <td style="font-size:0.82rem;color:rgba(255,255,255,0.4);">${formatCurrency(p.precio_costo||0)}</td>
      <td style="font-weight:700;color:var(--color-primary-light);">${formatCurrency(p.precio_final||p.precio_venta)}</td>
      <td><span class="badge ${p.stock===0?'badge-danger':p.stock<=5?'badge-warning':'badge-success'}">${p.stock} uds</span></td>
      <td><span class="badge ${p.activo!==false?'badge-success':'badge-muted'}">${p.activo!==false?'Activo':'Inactivo'}</span></td>
      <td>
        <div style="display:flex;gap:6px;">
          <button class="btn-table btn-table-edit" onclick="editProduct(${p.id})">✏️</button>
          <button class="btn-table btn-table-delete" onclick="deleteProduct(${p.id})">🗑</button>
          <a href="../producto.html?id=${p.id}" target="_blank" class="btn-table btn-table-view">👁</a>
        </div>
      </td>
    </tr>`).join('');
}

function calcMargen() {
  const costo = parseFloat(document.getElementById('pCosto').value)||0;
  const venta = parseFloat(document.getElementById('pVenta').value)||0;
  const el = document.getElementById('margenInfo');
  if (!costo||!venta) { el.textContent='Margen: –'; return; }
  const margen = ((venta-costo)/costo*100).toFixed(1); // Margen sobre costo (Markup)
  const ganancia = venta-costo;
  el.textContent = `Margen (s/Costo): ${margen}% · Ganancia: C$${ganancia.toFixed(2)}`;
  el.style.color = margen > 30 ? 'var(--color-success)' : margen > 15 ? 'var(--color-warning)' : 'var(--color-danger)';
}

function openProductModal(product = null) {
  document.getElementById('modalProdTitle').textContent = product ? 'Editar Producto' : 'Nuevo Producto';
  document.getElementById('pEditId').value = product?.id||'';
  document.getElementById('pNombre').value = product?.nombre||'';
  document.getElementById('pSku').value = product?.sku||'';
  document.getElementById('pMarca').value = product?.marca||'';
  document.getElementById('pCategoria').value = product?.categoria||'Skincare';
  document.getElementById('pCosto').value = product?.precio_costo||'';
  document.getElementById('pVenta').value = product?.precio_venta||'';
  document.getElementById('pStock').value = product?.stock||0;
  document.getElementById('pStockMin').value = product?.stock_minimo||5;
  document.getElementById('pDescuento').value = product?.descuento||0;
  document.getElementById('pImagenFile').value = '';
  
  const preview = document.getElementById('pImagenPreview');
  if (product && product.imagen_url) {
    preview.src = product.imagen_url;
    preview.style.display = 'block';
  } else {
    preview.src = '';
    preview.style.display = 'none';
  }
  
  document.getElementById('pDesc').value = product?.descripcion||'';
  document.getElementById('pBeneficios').value = product?.beneficios||'';
  document.getElementById('pNuevo').checked = !!product?.es_nuevo;
  document.getElementById('pDestacado').checked = !!product?.es_destacado;
  calcMargen();
  document.getElementById('productModal').classList.add('active');
}

async function editProduct(id) {
  try {
    const p = await api.productos.get(id); // Obtener info fresca del backend
    if (p) {
      const idx = allProducts.findIndex(x=>x.id===id);
      if (idx>=0) allProducts[idx] = p; // Actualiza el arreglo local
      openProductModal(p);
    }
  } catch (err) {
    // Fallback: usar info local si falla la red
    const local = allProducts.find(x=>x.id===id);
    if(local) openProductModal(local);
  }
}

async function saveProduct() {
  const nombre = document.getElementById('pNombre').value;
  if (!nombre) { showToast('El nombre es requerido', 'error'); return; }
  const editId = document.getElementById('pEditId').value;
  const data = {
    nombre, sku: document.getElementById('pSku').value,
    marca: document.getElementById('pMarca').value,
    categoria: document.getElementById('pCategoria').value,
    precio_costo: parseFloat(document.getElementById('pCosto').value)||0,
    precio_venta: parseFloat(document.getElementById('pVenta').value)||0,
    stock: parseInt(document.getElementById('pStock').value)||0,
    stock_minimo: parseInt(document.getElementById('pStockMin').value)||5,
    descuento: parseInt(document.getElementById('pDescuento').value)||0,
    descripcion: document.getElementById('pDesc').value,
    beneficios: document.getElementById('pBeneficios').value,
    es_nuevo: document.getElementById('pNuevo').checked,
    es_destacado: document.getElementById('pDestacado').checked,
  };
  data.precio_final = data.descuento > 0 ? Math.round(data.precio_venta*(1-data.descuento/100)) : data.precio_venta;
  data.activo = true;

  const formData = new FormData();
  for (const key in data) formData.append(key, data[key]);
  const fileInput = document.getElementById('pImagenFile');
  if (fileInput.files.length > 0) formData.append('imagen_file', fileInput.files[0]);

  if (editId) {
    try { 
      const res = await api.productos.update(parseInt(editId), formData); 
      data.imagen_url = res.imagen_url || data.imagen_url;
    } catch {}
    const idx = allProducts.findIndex(x=>x.id===parseInt(editId));
    if (idx>=0) allProducts[idx] = {...allProducts[idx], ...data};
    showToast('Producto actualizado ✅', 'success');
  } else {
    try { 
      const res = await api.productos.create(formData); 
      allProducts.unshift({...data, id: res.id||Date.now(), imagen_url: res.imagen_url || data.imagen_url}); 
    }
    catch { allProducts.unshift({...data, id: Date.now()}); }
    showToast('Producto creado ✅', 'success');
  }
  closeModal('productModal');
  filterProds();
}

function deleteProduct(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  allProducts = allProducts.filter(x=>x.id!==id);
  try { api.productos.delete(id); } catch {}
  filterProds();
  showToast('Producto eliminado', 'info');
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('active'); });
});

// Handle #nuevo hash
if (window.location.hash === '#nuevo') setTimeout(openProductModal, 300);

init();
</script>
</body>
</html>
