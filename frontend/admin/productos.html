<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos – SISCO Shiny Skin</title>
  <link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
</head>
<body class="admin-body">

<aside class="admin-sidebar" id="sidebar"></aside>

<div class="admin-main">
  <header class="admin-topbar">
    <div class="topbar-title">🧴 Gestión de Catálogo y Precios</div>
    <div class="topbar-actions" style="display:flex;gap:8px;">
      <button type="button" class="btn-admin-secondary" onclick="exportProductsCSV()">📊 Exportar Excel</button>
      <button class="btn-admin-primary" onclick="openModal()">➕ Nuevo Producto</button>
    </div>
  </header>

  <div class="admin-content">

    <div class="actions-bar">
      <div class="actions-bar-left">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input class="search-input-admin" type="text" id="searchProd" placeholder="Buscar nombre, SKU o marca..." oninput="renderTable()" />
        </div>
        <select class="admin-form-control" style="width:auto;padding:9px 14px;" id="filterCat" onchange="renderTable()">
          <option value="">Todas las categorías</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;color:rgba(255,255,255,0.7);cursor:pointer;">
          <input type="checkbox" id="chkInactivos" onchange="loadProducts()" /> Mostrar inactivos
        </label>
      </div>
      <div class="actions-bar-right">
        <span style="font-size:0.82rem;color:rgba(188,210,233,0.65);" id="totalLabel">0 productos</span>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría / Marca</th>
              <th>Costo</th>
              <th>Precio Final</th>
              <th>Stock (Físico / Online)</th>
              <th>Vencimiento</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="prodTableBody">
            <tr><td colspan="8" style="text-align:center;padding:36px;">Cargando catálogo...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Modal Crear / Editar Producto -->
<div class="modal-overlay" id="prodModal" onclick="if(event.target===this)closeModal()">
  <div class="admin-modal" style="max-width:720px;">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Nuevo Producto</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <form id="prodForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="prodId" />
      <div class="admin-form-grid">
        <div class="admin-form-group admin-form-full">
          <label class="admin-form-label">Nombre comercial del producto *</label>
          <input class="admin-form-control" id="fNombre" required placeholder="Ej. ANUA Heartleaf 77% Soothing Toner" />
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label">SKU (dejar vacío para autogenerar)</label>
          <input class="admin-form-control" id="fSku" placeholder="Ej. SKN-TON-005" />
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Marca *</label>
          <input class="admin-form-control" id="fMarca" list="brandSuggestions" required placeholder="Ej. ANUA, COSRX, rom&nd..." />
          <datalist id="brandSuggestions"></datalist>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label">Categoría *</label>
          <input class="admin-form-control" id="fCategoria" list="catSuggestions" required placeholder="Ej. Sueros & Esencias, Labios..." />
          <datalist id="catSuggestions"></datalist>
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Línea principal</label>
          <select class="admin-form-control" id="fLinea">
            <option value="Skincare">Skincare (Cuidado facial)</option>
            <option value="Makeup">Makeup (Maquillaje)</option>
          </select>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label">Tamaño / Contenido</label>
          <input class="admin-form-control" id="fTamano" placeholder="Ej. 50 ml, 15 g" />
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Tono / Variante (opcional)</label>
          <input class="admin-form-control" id="fTono" placeholder="Ej. 21 Natural Beige, Figfig" />
        </div>

        <!-- Calculadora de Precio Sugerido (FRQ-0012 / HU-12) -->
        <div class="admin-form-full" style="background:rgba(188,210,233,0.06);border:1px solid var(--admin-border);border-radius:var(--radius-md);padding:14px;">
          <div style="font-size:0.76rem;font-weight:700;color:var(--color-brand-pastel);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.6px;">
            🧮 Calculadora de Costo, Margen y Precio de Venta (C$)
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
            <div class="admin-form-group">
              <label class="admin-form-label">Costo (C$) *</label>
              <input class="admin-form-control" type="number" step="0.01" min="0" id="fCosto" required oninput="calcSuggestedFromMargin()" />
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">% Ganancia</label>
              <input class="admin-form-control" type="number" step="0.1" min="0" id="fMargen" value="75" oninput="calcSuggestedFromMargin()" />
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">Precio Venta *</label>
              <input class="admin-form-control" type="number" step="0.01" min="0.01" id="fVenta" required oninput="calcMarginFromSale()" />
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">Descuento (%)</label>
              <input class="admin-form-control" type="number" step="1" min="0" max="95" id="fDescuento" value="0" oninput="updateFinalPriceHint()" />
            </div>
          </div>
          <div style="font-size:0.78rem;color:#34d399;margin-top:8px;" id="pricePreviewHint">Precio final al público: C$ 0.00</div>
        </div>

        <!-- Stock Dual Tienda Física + Online (FRQ-0009) -->
        <div class="admin-form-group">
          <label class="admin-form-label">🏬 Stock Tienda Física</label>
          <input class="admin-form-control" type="number" min="0" id="fStockFisico" value="5" oninput="updateTotalStockHint()" />
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">🌐 Stock Online</label>
          <input class="admin-form-control" type="number" min="0" id="fStockOnline" value="5" oninput="updateTotalStockHint()" />
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label">Stock Mínimo (Alerta)</label>
          <input class="admin-form-control" type="number" min="0" id="fStockMin" value="5" />
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Fecha de Vencimiento</label>
          <input class="admin-form-control" type="date" id="fVencimiento" />
        </div>

        <div class="admin-form-group admin-form-full">
          <label class="admin-form-label">Descripción del producto</label>
          <textarea class="admin-form-control" id="fDesc" rows="2" placeholder="Descripción breve de uso y textura..."></textarea>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label">Beneficios (separados por ·)</label>
          <input class="admin-form-control" id="fBeneficios" placeholder="Hidrata · Calma rojeces · Sin fragancia" />
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Ingredientes principales</label>
          <input class="admin-form-control" id="fIngredientes" placeholder="Centella Asiatica, Niacinamida 5%..." />
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label">URL de Imagen (o subir archivo)</label>
          <input class="admin-form-control" id="fImagenUrl" placeholder="https://..." oninput="previewUrlImg()" />
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label">Subir fotografía local</label>
          <input class="admin-form-control" type="file" id="fImagenFile" accept="image/*" onchange="previewFileImg()" style="padding:7px;" />
        </div>

        <div class="admin-form-full" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">
          <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:0.84rem;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="fNuevo" /> 🆕 Marcar "Lo Nuevo"</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="fDestacado" /> ⭐ Destacado en Inicio</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="fActivo" checked /> ✅ Visible en Tienda</label>
          </div>
          <img id="imgPreview" src="" alt="Vista previa" style="width:56px;height:56px;border-radius:10px;object-fit:cover;display:none;border:1px solid var(--admin-border);" />
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;">
        <button type="button" class="btn-admin-secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn-admin-primary" id="btnSaveProd">💾 Guardar Producto</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin-common.js"></script>
<script>
renderAdminSidebar('productos');

let allProducts = [];
let categoriesList = [];
let brandsList = [];

async function init() {
  try { categoriesList = await api.productos.categorias(); } catch { categoriesList = []; }
  try { brandsList = await api.productos.marcas(); } catch { brandsList = []; }

  const catSel = document.getElementById('filterCat');
  const subcats = categoriesList.filter(c => c.parent_id !== null);
  const listForFilter = subcats.length ? subcats : categoriesList;
  catSel.innerHTML = `<option value="">Todas las categorías</option>
    <option value="skincare">✨ Línea Skincare</option>
    <option value="makeup">💄 Línea Makeup</option>` +
    listForFilter.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');

  document.getElementById('catSuggestions').innerHTML = listForFilter.map(c => `<option value="${c.nombre}">`).join('');
  document.getElementById('brandSuggestions').innerHTML = brandsList.map(b => `<option value="${b.nombre}">`).join('');

  await loadProducts();
  if (window.location.hash === '#nuevo') openModal();
}

async function loadProducts() {
  const incluir = document.getElementById('chkInactivos').checked;
  allProducts = await fetchProductos(incluir ? { incluir_inactivos: 'true' } : {});
  renderTable();
}

function renderTable() {
  const q = normalizeText(document.getElementById('searchProd').value);
  const cat = document.getElementById('filterCat').value;

  const filtered = allProducts.filter(p => {
    if (q && !normalizeText(`${p.nombre} ${p.sku || ''} ${p.marca || ''}`).includes(q)) return false;
    if (cat && !matchesCategoryFilter(p, cat)) return false;
    return true;
  });

  document.getElementById('totalLabel').textContent = `${filtered.length} producto${filtered.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('prodTableBody');

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:36px;color:rgba(255,255,255,0.4);">No se encontraron productos</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(p => {
    const crit = p.stock <= (p.stock_minimo ?? 5);
    const venc = p.por_vencer ? `<span class="badge badge-warning" title="Próximo a vencer">⚠️ ${p.fecha_vencimiento}</span>` : (p.fecha_vencimiento || '—');
    return `
      <tr style="${!p.activo ? 'opacity:0.55;' : ''}">
        <td>
          <div style="display:flex;align-items:center;gap:12px;">
            <img src="${resolveImageUrl(p.imagen_url)}" onerror="handleImgError(this)" style="width:42px;height:42px;border-radius:10px;object-fit:cover;background:#1e293b;" alt=""/>
            <div>
              <div class="table-product-name">${p.nombre}</div>
              <div class="table-product-sku">${p.sku || 'Sin SKU'} ${p.tamano ? `· ${p.tamano}` : ''} ${p.tono ? `· ${p.tono}` : ''}</div>
            </div>
          </div>
        </td>
        <td>
          <div style="font-weight:600;">${p.categoria || '—'}</div>
          <div style="font-size:0.75rem;color:var(--color-brand-pastel);">${p.marca || '—'}</div>
        </td>
        <td>${formatCurrency(p.precio_costo)}</td>
        <td>
          <div style="font-weight:700;color:#34d399;">${formatCurrency(p.precio_final)}</div>
          ${p.descuento > 0 ? `<div style="font-size:0.72rem;color:#fbbf24;">-${p.descuento}% (Base: ${formatCurrency(p.precio_venta)})</div>` : ''}
        </td>
        <td>
          <div style="font-weight:700;color:${crit ? '#f87171' : '#ffffff'};">${p.stock} uds. ${crit ? '⚠️' : ''}</div>
          <div style="font-size:0.74rem;color:rgba(188,210,233,0.65);">🏬 ${p.stock_fisico ?? p.stock} · 🌐 ${p.stock_online ?? 0}</div>
        </td>
        <td style="font-size:0.8rem;">${venc}</td>
        <td>
          <span class="status-badge ${p.activo ? 'status-entregado' : 'status-cancelado'}">${p.activo ? 'Activo' : 'Inactivo'}</span>
        </td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn-table btn-table-edit" onclick="editProduct(${p.id})">✏️ Editar</button>
            ${window.IS_ADMIN && p.activo ? `<button class="btn-table btn-table-delete" onclick="deactivateProduct(${p.id})">🗑</button>` : ''}
          </div>
        </td>
      </tr>`;
  }).join('');
}

function calcSuggestedFromMargin() {
  const costo = parseFloat(document.getElementById('fCosto').value) || 0;
  const margen = parseFloat(document.getElementById('fMargen').value) || 0;
  if (costo > 0) {
    document.getElementById('fVenta').value = (costo * (1 + margen / 100)).toFixed(2);
  }
  updateFinalPriceHint();
}

function calcMarginFromSale() {
  const costo = parseFloat(document.getElementById('fCosto').value) || 0;
  const venta = parseFloat(document.getElementById('fVenta').value) || 0;
  if (costo > 0 && venta > 0) {
    document.getElementById('fMargen').value = (((venta - costo) / costo) * 100).toFixed(1);
  }
  updateFinalPriceHint();
}

function updateFinalPriceHint() {
  const costo = parseFloat(document.getElementById('fCosto').value) || 0;
  const venta = parseFloat(document.getElementById('fVenta').value) || 0;
  const desc = parseFloat(document.getElementById('fDescuento').value) || 0;
  const finalP = venta * (1 - desc / 100);
  const utilidad = finalP - costo;
  document.getElementById('pricePreviewHint').textContent =
    `Precio final al cliente: ${formatCurrency(finalP)} · Utilidad unitaria estimada: ${formatCurrency(utilidad)}`;
}

function updateTotalStockHint() {
  const fis = parseInt(document.getElementById('fStockFisico').value) || 0;
  const onl = parseInt(document.getElementById('fStockOnline').value) || 0;
  document.getElementById('modalTitle').dataset.totalStock = fis + onl;
}

function previewUrlImg() {
  const url = document.getElementById('fImagenUrl').value.trim();
  const img = document.getElementById('imgPreview');
  if (url) { img.src = resolveImageUrl(url); img.style.display = 'block'; }
}

function previewFileImg() {
  const file = document.getElementById('fImagenFile').files[0];
  const img = document.getElementById('imgPreview');
  if (file) {
    img.src = URL.createObjectURL(file);
    img.style.display = 'block';
  }
}

function openModal(prod = null) {
  document.getElementById('prodForm').reset();
  document.getElementById('fImagenFile').value = '';
  const img = document.getElementById('imgPreview');

  if (prod) {
    document.getElementById('modalTitle').textContent = '✏️ Editar Producto';
    document.getElementById('prodId').value = prod.id;
    document.getElementById('fNombre').value = prod.nombre || '';
    document.getElementById('fSku').value = prod.sku || '';
    document.getElementById('fMarca').value = prod.marca || '';
    document.getElementById('fCategoria').value = prod.categoria || '';
    document.getElementById('fLinea').value = prod.linea === 'Makeup' ? 'Makeup' : 'Skincare';
    document.getElementById('fTamano').value = prod.tamano || '';
    document.getElementById('fTono').value = prod.tono || '';
    document.getElementById('fCosto').value = prod.precio_costo ?? 0;
    document.getElementById('fVenta').value = prod.precio_venta ?? 0;
    document.getElementById('fDescuento').value = prod.descuento ?? 0;
    document.getElementById('fStockFisico').value = prod.stock_fisico ?? prod.stock ?? 0;
    document.getElementById('fStockOnline').value = prod.stock_online ?? 0;
    document.getElementById('fStockMin').value = prod.stock_minimo ?? 5;
    document.getElementById('fVencimiento').value = prod.fecha_vencimiento || '';
    document.getElementById('fDesc').value = prod.descripcion || '';
    document.getElementById('fBeneficios').value = prod.beneficios || '';
    document.getElementById('fIngredientes').value = prod.ingredientes || '';
    document.getElementById('fImagenUrl').value = prod.imagen_url || '';
    document.getElementById('fNuevo').checked = !!prod.es_nuevo;
    document.getElementById('fDestacado').checked = !!prod.es_destacado;
    document.getElementById('fActivo').checked = prod.activo !== false;
    calcMarginFromSale();
    if (prod.imagen_url) { img.src = resolveImageUrl(prod.imagen_url); img.style.display = 'block'; }
    else img.style.display = 'none';
  } else {
    document.getElementById('modalTitle').textContent = '➕ Registrar Nuevo Producto';
    document.getElementById('prodId').value = '';
    document.getElementById('fMargen').value = 75;
    document.getElementById('fStockFisico').value = 5;
    document.getElementById('fStockOnline').value = 5;
    document.getElementById('fStockMin').value = 5;
    document.getElementById('fActivo').checked = true;
    img.style.display = 'none';
    updateFinalPriceHint();
  }
  document.getElementById('prodModal').classList.add('active');
}

function closeModal() {
  document.getElementById('prodModal').classList.remove('active');
}

function editProduct(id) {
  const p = allProducts.find(x => x.id == id);
  if (p) openModal(p);
}

async function saveProduct(e) {
  e.preventDefault();
  const id = document.getElementById('prodId').value;
  const file = document.getElementById('fImagenFile').files[0];

  const payload = {
    nombre: document.getElementById('fNombre').value.trim(),
    sku: document.getElementById('fSku').value.trim(),
    marca_nombre: document.getElementById('fMarca').value.trim(),
    categoria_nombre: document.getElementById('fCategoria').value.trim(),
    linea: document.getElementById('fLinea').value,
    tamano: document.getElementById('fTamano').value.trim(),
    tono: document.getElementById('fTono').value.trim(),
    precio_costo: parseFloat(document.getElementById('fCosto').value) || 0,
    porcentaje_ganancia: parseFloat(document.getElementById('fMargen').value) || 0,
    precio_venta: parseFloat(document.getElementById('fVenta').value) || 0,
    descuento: parseFloat(document.getElementById('fDescuento').value) || 0,
    stock_fisico: parseInt(document.getElementById('fStockFisico').value) || 0,
    stock_online: parseInt(document.getElementById('fStockOnline').value) || 0,
    stock_minimo: parseInt(document.getElementById('fStockMin').value) || 5,
    fecha_vencimiento: document.getElementById('fVencimiento').value || '',
    descripcion: document.getElementById('fDesc').value.trim(),
    beneficios: document.getElementById('fBeneficios').value.trim(),
    ingredientes: document.getElementById('fIngredientes').value.trim(),
    imagen_url: document.getElementById('fImagenUrl').value.trim(),
    es_nuevo: document.getElementById('fNuevo').checked,
    es_destacado: document.getElementById('fDestacado').checked,
    activo: document.getElementById('fActivo').checked,
  };

  let bodyToSend = payload;
  if (file) {
    const fd = new FormData();
    Object.entries(payload).forEach(([k, v]) => fd.append(k, String(v)));
    fd.append('imagen', file);
    bodyToSend = fd;
  }

  const btn = document.getElementById('btnSaveProd');
  btn.disabled = true;
  try {
    let savedRes;
    if (id) {
      savedRes = await api.productos.update(id, bodyToSend);
      showToast('Producto actualizado correctamente', 'success');
    } else {
      savedRes = await api.productos.create(bodyToSend);
      showToast('Producto agregado al catálogo', 'success');
    }
    const savedProd = savedRes && (savedRes.producto || (savedRes.id ? savedRes : null));
    document.getElementById('searchProd').value = '';
    document.getElementById('filterCat').value = '';
    closeModal();
    await loadProducts();
    if (savedProd && !allProducts.some(x => Number(x.id) === Number(savedProd.id))) {
      allProducts.unshift(savedProd);
      renderTable();
    }
  } catch (err) {
    showToast(err.message || 'Error al guardar el producto', 'error');
  } finally {
    btn.disabled = false;
  }
}

async function deactivateProduct(id) {
  const p = allProducts.find(x => x.id == id);
  if (!p || !confirm(`¿Desactivar "${p.nombre}" del catálogo público?`)) return;
  try {
    await api.productos.delete(id);
    showToast('Producto desactivado', 'info');
    await loadProducts();
  } catch (err) {
    showToast(err.message || 'No se pudo desactivar', 'error');
  }
}

function exportProductsCSV() {
  const headers = ['SKU', 'Nombre Producto', 'Marca', 'Línea', 'Categoría', 'Tamaño', 'Tono', 'Costo (C$)', 'Precio Venta (C$)', 'Descuento (%)', 'Precio Final (C$)', 'Stock Físico', 'Stock Online', 'Stock Total', 'Vencimiento', 'Estado'];
  const rows = allProducts.map(p => [
    p.sku || '', p.nombre, p.marca || '', p.linea || 'Skincare', p.categoria || '',
    p.tamano || '', p.tono || '', p.precio_costo, p.precio_venta, p.descuento || 0,
    p.precio_final, p.stock_fisico ?? p.stock, p.stock_online ?? 0, p.stock,
    p.fecha_vencimiento || '', p.activo ? 'Activo' : 'Inactivo'
  ]);
  downloadCSVFile(`SISCO_Catalogo_Productos_${new Date().toISOString().slice(0, 10)}.csv`, headers, rows);
}

init();
</script>
</body>
</html>
