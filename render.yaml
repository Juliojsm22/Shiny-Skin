services:
  - type: web
    name: sisco-shinyskin
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 16 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: IVA_RATE
        value: "0.0"
      # Recomendado en producción para persistencia permanente (Supabase / Render PostgreSQL):
      # - key: DATABASE_URL
      #   sync: false
